experiment:
  name: "pred_experiment"
  tracking_uri: "file:mlruns"
  random_seed: 42

data:
  raw_path: "data/energy_consumption_synthetic.csv"
  target_col: "EnergyConsumption"
  time_col: "Timestamp"
  train_ratio: 0.6
  val_ratio: 0.2

features:
  version: "v2"

model:
  name: "catboost"
  hyperparameters:
    iterations: 1500
    learning_rate: 0.03
    depth: 4
    l2_leaf_reg: 5
    loss_function: "RMSE"
    eval_metric: "MAE"
    early_stopping_rounds: 50